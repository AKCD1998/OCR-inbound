<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
header{background:#1a1d27;border-bottom:1px solid #2d3148;padding:16px 24px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;font-weight:600;color:#fff}
header span{font-size:12px;color:#6b7280}
.file-tabs{display:flex;background:#1a1d27;border-bottom:1px solid #2d3148;padding:0 24px}
.file-tab{padding:12px 20px;cursor:pointer;font-size:13px;color:#9ca3af;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.file-tab:hover{color:#e0e0e0}
.file-tab.active{color:#60a5fa;border-bottom-color:#60a5fa}
.layout{display:flex;height:calc(100vh - 110px)}
.sidebar{width:220px;background:#13151f;border-right:1px solid #2d3148;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-section{padding:12px;border-bottom:1px solid #2d3148}
.sidebar-section label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;display:block;margin-bottom:8px}
.page-btns{display:flex;flex-wrap:wrap;gap:6px}
.page-btn{padding:5px 10px;border-radius:6px;border:1px solid #2d3148;background:transparent;color:#9ca3af;font-size:12px;cursor:pointer;transition:all .15s}
.page-btn:hover{border-color:#4b5563;color:#e0e0e0}
.page-btn.active{background:#1e3a5f;border-color:#3b82f6;color:#60a5fa;font-weight:600}
.zone-filters{padding:12px;flex:1;overflow-y:auto}
.zone-filters label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;display:block;margin-bottom:8px}
.zone-chip{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px;color:#9ca3af;transition:background .15s;margin-bottom:2px}
.zone-chip:hover{background:#1e2235;color:#e0e0e0}
.zone-chip input{accent-color:#3b82f6}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.main{flex:1;overflow-y:auto;padding:20px 24px}
.stats-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#1a1d27;border:1px solid #2d3148;border-radius:8px;padding:10px 16px}
.stat .num{font-size:22px;font-weight:700;color:#fff}
.stat .lbl{font-size:11px;color:#6b7280;margin-top:2px}
.zone-section{margin-bottom:24px}
.zone-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zone-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.zone-count{font-size:11px;color:#6b7280}
.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.region-card{background:#1a1d27;border:1px solid #2d3148;border-radius:8px;padding:12px;transition:border-color .15s}
.region-card:hover{border-color:#4b5563}
.region-card .text{font-size:14px;color:#e0e0e0;word-break:break-word;line-height:1.5;margin-bottom:8px}
.region-card .text.empty{color:#4b5563;font-style:italic;font-size:12px}
.region-card .meta{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:4px}
.conflict{background:#3b1818;color:#f87171}
.unique{background:#1a2e1a;color:#4ade80}
.agreed{background:#1a2a3b;color:#60a5fa}
.conf-high{background:#1a2a1a;color:#4ade80}
.conf-medium{background:#2a2a1a;color:#facc15}
.conf-low{background:#2a1a1a;color:#f87171}
.no-results{text-align:center;color:#4b5563;padding:60px 20px;font-size:14px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2d3148;border-radius:3px}
</style>
</head>

const ZONE_COLORS={
  header:{bg:'#1e3a5f',text:'#93c5fd',dot:'#3b82f6'},
  vendor_info:{bg:'#1a3a2a',text:'#86efac',dot:'#22c55e'},
  customer_info:{bg:'#2a1a3a',text:'#c4b5fd',dot:'#a855f7'},
  invoice_metadata:{bg:'#3a2a1a',text:'#fcd34d',dot:'#f59e0b'},
  product_table_header:{bg:'#1a2a3a',text:'#67e8f9',dot:'#06b6d4'},
  product_table_body:{bg:'#1a3a3a',text:'#5eead4',dot:'#14b8a6'},
  totals:{bg:'#3a1a2a',text:'#f9a8d4',dot:'#ec4899'},
  payment_info:{bg:'#2a2a1a',text:'#fde68a',dot:'#d97706'},
  footer:{bg:'#2a2a2a',text:'#9ca3af',dot:'#6b7280'},
  unknown:{bg:'#1f1f1f',text:'#6b7280',dot:'#374151'},
};
const ZONE_LABELS={
  header:'Header',vendor_info:'Vendor',customer_info:'Customer',
  invoice_metadata:'Invoice Metadata',product_table_header:'Table Header',
  product_table_body:'Table Body',totals:'Totals',payment_info:'Payment Info',
  footer:'Footer',unknown:'Unknown',
};
const ZONE_ORDER=['header','vendor_info','customer_info','invoice_metadata',
  'product_table_header','product_table_body','totals','payment_info','footer','unknown'];

let activeFile=0, activePage=1;
let activeZones=new Set(Object.keys(ZONE_COLORS));

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function init(){renderFileTabs();update();}

function renderFileTabs(){
  document.getElementById('fileTabs').innerHTML=DATA.files.map((f,i)=>
    '<div class="file-tab '+(i===activeFile?'active':'')+'" onclick="selectFile('+i+')">'+esc(f.name)+'</div>'
  ).join('');
}

function selectFile(i){activeFile=i;activePage=1;renderFileTabs();update();}

function update(){
  const f=DATA.files[activeFile];
  document.getElementById('subtitle').textContent=f.name+' — '+f.pages+' หน้า';
  renderPageBtns(f);renderZoneFilters(f);renderMain(f);
}

function renderPageBtns(f){
  document.getElementById('pageBtns').innerHTML=
    Array.from({length:f.pages},(_,i)=>i+1).map(p=>
      '<button class="page-btn '+(p===activePage?'active':'')+'" onclick="selectPage('+p+')">หน้า '+p+'</button>'
    ).join('');
}

function selectPage(p){
  activePage=p;
  document.querySelectorAll('.page-btn').forEach((b,i)=>b.classList.toggle('active',i+1===p));
  renderMain(DATA.files[activeFile]);
}

function renderZoneFilters(f){
  const zones=[...new Set(f.regions.map(r=>r.zone))].sort();
  document.getElementById('zoneFilters').innerHTML=zones.map(z=>{
    const c=ZONE_COLORS[z]||ZONE_COLORS.unknown;
    return '<label class="zone-chip"><input type="checkbox"'+(activeZones.has(z)?' checked':'')+
      ' onchange="toggleZone(\''+z+'\')"><span class="dot" style="background:'+c.dot+'"></span><span>'+
      (ZONE_LABELS[z]||z)+'</span></label>';
  }).join('');
}

function toggleZone(z){
  if(activeZones.has(z))activeZones.delete(z);else activeZones.add(z);
  renderMain(DATA.files[activeFile]);
}

function renderMain(f){
  const regs=f.regions.filter(r=>r.page===activePage&&activeZones.has(r.zone));
  const main=document.getElementById('main');
  if(!regs.length){main.innerHTML='<div class="no-results">ไม่มีข้อมูลสำหรับหน้านี้</div>';return;}

  const total=regs.length;
  const withText=regs.filter(r=>r.text&&r.text.trim()).length;
  const conflicts=regs.filter(r=>r.classification==='conflicting').length;
  const agreed=regs.filter(r=>r.classification==='agreed_by_all'||r.classification==='agreed_by_two').length;

  const byZone={};
  for(const r of regs){if(!byZone[r.zone])byZone[r.zone]=[];byZone[r.zone].push(r);}
  const sortedZones=ZONE_ORDER.filter(z=>byZone[z]).concat(Object.keys(byZone).filter(z=>!ZONE_ORDER.includes(z)));

  let html='<div class="stats-bar">'+
    '<div class="stat"><div class="num">'+total+'</div><div class="lbl">ทั้งหมด (regions)</div></div>'+
    '<div class="stat"><div class="num">'+withText+'</div><div class="lbl">อ่านได้</div></div>'+
    '<div class="stat"><div class="num">'+(total-withText)+'</div><div class="lbl">ขัดแย้ง/ว่าง</div></div>'+
    '<div class="stat"><div class="num">'+conflicts+'</div><div class="lbl">Conflict</div></div>'+
    '<div class="stat"><div class="num">'+agreed+'</div><div class="lbl">เห็นตรงกัน</div></div>'+
    '</div>';

  for(const zone of sortedZones){
    const rlist=byZone[zone];
    const c=ZONE_COLORS[zone]||ZONE_COLORS.unknown;
    html+='<div class="zone-section"><div class="zone-header">'+
      '<span class="zone-badge" style="background:'+c.bg+';color:'+c.text+'">'+(ZONE_LABELS[zone]||zone)+'</span>'+
      '<span class="zone-count">'+rlist.length+' regions</span></div><div class="region-grid">';
    for(const r of rlist){
      const hasText=r.text&&r.text.trim();
      const cl=r.classification==='conflicting'?'conflict':r.classification==='unique_to_one'?'unique':'agreed';
      const cf=r.confidence==='high'?'conf-high':r.confidence==='medium'?'conf-medium':'conf-low';
      html+='<div class="region-card"><div class="text '+(hasText?'':'empty')+'">'+(hasText?esc(r.text):'(ขัดแย้ง / ว่าง)')+'</div>'+
        '<div class="meta"><span class="badge '+cl+'">'+r.classification+'</span>'+
        '<span class="badge '+cf+'">'+r.confidence+'</span></div></div>';
    }
    html+='</div></div>';
  }
  main.innerHTML=html;
}
init();
</script>
